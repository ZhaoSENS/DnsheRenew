name: Monthly DNSHE Renew

on:
  schedule:
    - cron: "15 0 1 * *"
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    environment:
      name: dnshe
    steps:
      - name: Renew DNSHE domains
        id: renew
        uses: nhirsama/DnsheRenew@v0.1
        with:
          api-keys: ${{ secrets.cfsd_908e524b5c8579ad699c63b5b52f54a7 }}
          api-secrets: ${{ secrets.8a7e64e259da32efb8561af80395f4ae2a8cb42a34898fdfc0940225efa48ff2 }}
